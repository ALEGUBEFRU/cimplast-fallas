<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Novedades Mantenimiento</title>
<style>
:root{
  --bg:#eef1ee; --card:#fff; --ink:#17221d; --ink2:#5a6861; --line:#d4dbd6; --top:#1f3a2e; --topink:#f2f5f1;
  --ok:#2d8a52; --amb:#b97f00; --rojo:#cc4a17; --azul:#2f5f86; --gris:#8a968f;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111714; --card:#1b231f; --ink:#e7ece8; --ink2:#a4b1aa; --line:#2d3a33; --top:#16291f; --topink:#e7ece8;
  --ok:#5cc583; --amb:#e8b23c; --rojo:#f08050; --azul:#7fb0d8; --gris:#7d8a83; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--top);color:var(--topink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.fila1{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:19px;margin:0;font-weight:700}
.area{font-size:13px;opacity:.85}
.btn-act{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:9px 12px;color:var(--topink);font-weight:600;font-size:14px}
.estado{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:3px 10px}
.pill i{width:8px;height:8px;border-radius:50%;background:#7ddc9c}
.pill.off i{background:#f2a33a}
.pill.cola{background:#f2a33a;color:#1b1206;font-weight:700}
main{padding:12px 12px 0;display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.resumen{font-size:13.5px;color:var(--ink2);padding:2px 4px}
.filtro{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.filtro button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--ink2)}
.filtro button[aria-pressed="true"]{background:var(--top);color:var(--topink)}
.tecs{display:flex;flex-wrap:wrap;gap:8px}
.tecs button{border:2px solid var(--line);background:var(--bg);border-radius:20px;padding:9px 14px;font-weight:600;font-size:14.5px}
.tecs button[aria-pressed="true"]{border-color:var(--azul);background:var(--azul);color:#fff}
.tit{font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gris);border-radius:12px;padding:12px 12px 12px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card.det{border-left-color:var(--rojo)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .eq{font-weight:700;font-size:16.5px}
.card .dias{font-size:13px;color:var(--ink2);white-space:nowrap}
.card .sin{font-size:14px;color:var(--ink2);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border-radius:12px;padding:2px 9px;border:1px solid var(--line);color:var(--ink2)}
.chip.det{border-color:var(--rojo);color:var(--rojo);font-weight:600}
.nov{font-size:13.5px;border-radius:8px;padding:6px 9px;background:var(--bg)}
.nov b{font-weight:700}
.nov.falta{color:var(--amb);font-weight:600;background:transparent;border:1px dashed var(--amb)}
.nov.pend{border:1px dashed var(--gris)}
.nov.def{border:2px solid var(--amb)}
.vacio{text-align:center;color:var(--ink2);padding:40px 10px}
.pie{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center}
.pie .b{width:100%;max-width:640px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pie button{background:var(--card);border:2px solid var(--top);border-radius:12px;padding:13px 8px;font-weight:700}
.pie button.p{background:var(--top);color:var(--topink)}
.card.trab{border-left-color:var(--azul)}
.chip.trab{border-color:var(--azul);color:var(--azul);font-weight:600}
.chip.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.selp{display:flex;flex-wrap:wrap;gap:8px}
.selp button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600}
.selp button[aria-pressed="true"]{border-color:var(--top);background:var(--top);color:var(--topink)}
.selp button.fin[aria-pressed="true"]{border-color:var(--ok);background:var(--ok);color:#fff}
/* hoja de carga */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.hoja h2{margin:0;font-size:18px}
.hoja .sub{font-size:14px;color:var(--ink2);margin:-6px 0 0}
.opc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opc button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 8px;font-weight:600;font-size:15px;min-height:56px}
.opc button[aria-pressed="true"]{border-color:var(--top);background:var(--top);color:var(--topink)}
.opc button.res[aria-pressed="true"]{border-color:var(--ok);background:var(--ok);color:#fff}
.ger{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:600;background:var(--bg);text-align:left}
.ger[aria-pressed="true"]{border-color:var(--amb);color:var(--amb)}
.ger .caja{width:24px;height:24px;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center;flex:none}
.ger[aria-pressed="true"] .caja::after{content:"✓";font-weight:800}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:70px;resize:vertical}
label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:5px}
.acc{display:flex;gap:8px}
.acc button{flex:1;border-radius:12px;padding:14px;font-weight:700;border:0}
.prim{background:var(--top);color:var(--topink)}
.prim:disabled{opacity:.4}
.sec{background:var(--bg);border:2px solid var(--line)!important}
.aviso{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.err{color:var(--rojo);font-size:14px}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="fila1">
    <div><h1>Novedades</h1><div class="area" id="area"></div></div>
    <button class="btn-act" id="btnAct" type="button">Actualizar</button>
  </div>
  <div class="estado" id="estado"></div>
</header>
<main id="lista"></main>
<div class="pie"><div class="b"><button type="button" class="p" id="btnTrabajo">+ Trabajo</button><button type="button" id="btnGeneral">+ Novedad general</button></div></div>
<div id="capa"></div>
<div id="aviso" class="aviso" hidden></div>

<script>
"use strict";
const ESTADOS_FALLA = ["En reparación", "Falta repuesto", "Falta personal", "Espera tercero", "En observación", "Resuelta"];
const ESTADOS_TRABAJO = ["En curso", "Falta material", "Falta personal", "Pausado", "Terminado", "Pasó a OT"];
const CIERRE_TRABAJO = ["Terminado", "Pasó a OT"];
const ESTADOS_GENERAL = ["Falta personal", "Falta repuesto", "Pedido", "Otro"];
const AREAS = ["Plantas 3-4-5", "Titese (Planta 6)", "Matricería"];
const PLANTAS = {"Plantas 3-4-5": ["Planta 3", "Planta 4", "Planta 5"], "Titese (Planta 6)": ["Titese"], "Matricería": ["Matricería"]};
const K = {cfg: "nov_cfg", cola: "nov_cola", lista: "nov_lista", filtro: "nov_filtro"};
const FILTROS = [["hoy", "Hoy"], ["semana", "Semana"], ["mes", "Mes"], ["todas", "Todas"]];

// ── almacenamiento local (todo protegido: si falla, la app sigue) ──
function leer(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function guardar(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let cfg = leer(K.cfg, null);
let cola = leer(K.cola, []);
let lista = leer(K.lista, null);
let filtro = leer(K.filtro, "todas");
let enviando = false, cargando = false, ultimoError = "";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = d => new Date(d).toLocaleTimeString("es-PY", {hour:"2-digit", minute:"2-digit"});
const esHoy = d => new Date(d).toDateString() === new Date().toDateString();
const corto = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
function hace(d){
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 60) return `hace ${Math.max(m,0)} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}
function cuando(d){ return esHoy(d) ? `hoy ${hhmm(d)}` : new Date(d).toLocaleDateString("es-PY", {day:"2-digit", month:"2-digit"}) + " " + hhmm(d); }
function aviso(t){ const a = $("aviso"); a.textContent = t; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(() => a.hidden = true, 2600); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function desdeFiltro(f){
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (f === "hoy") return d;
  if (f === "semana"){ d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }  // desde el lunes
  if (f === "mes"){ d.setDate(1); return d; }
  return null;
}
const novDe = x => ({cargado: x.cargado, usuario: cfg.usuario, estado: x.estado, definicion: !!x.definicion, nota: x.nota, asignados: x.asignados || []});
const itemDeTrabajo = x => ({id: x.fallaId, tipo: "trabajo", equipo: x.equipo, planta: x.planta, desde: x.cargado, sintoma: x.descripcion,
  detenido: "", ot: "", subestado: "", novedad: novDe(x)});

// Fallas y trabajos del servidor, más los trabajos nuevos que todavía están en el teléfono
function todosLosItems(){
  const base = (lista && lista.items) || [];
  const ids = new Set(base.map(x => x.id));
  const nuevos = cola.filter(x => x.tipo === "trabajo" && x.descripcion && !ids.has(x.fallaId));
  const vistos = new Set();
  return base.concat(nuevos.filter(x => !vistos.has(x.fallaId) && vistos.add(x.fallaId)).map(itemDeTrabajo));
}

// ── red ──
async function traerLista(){
  if (!cfg || cargando) return;
  cargando = true; pintarEstado();
  try {
    const u = `${cfg.url}?accion=lista&clave=${encodeURIComponent(cfg.clave)}&area=${encodeURIComponent(cfg.area)}`;
    const r = await fetch(u, {cache: "no-store"});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Error del servidor");
    lista = j; guardar(K.lista, lista); ultimoError = "";
  } catch(e){ ultimoError = navigator.onLine ? "No se pudo actualizar: " + (e.message === "Failed to fetch" ? "el navegador bloqueó la conexión con Google (revisar dirección del servicio o permisos)" : e.message) : ""; }
  cargando = false; pintar();
}
async function enviarCola(){
  if (!cfg || enviando || !cola.length) return;
  enviando = true; pintarEstado();
  try {
    const body = JSON.stringify({clave: cfg.clave, usuario: cfg.usuario, area: cfg.area, items: cola.slice(0, 50)});
    const r = await fetch(cfg.url, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Error del servidor");
    const ok = new Set(j.recibidos || []);
    // Lo enviado pasa a ser la última novedad de su falla o trabajo, hasta la próxima actualización de la lista.
    if (lista) {
      lista.items = lista.items || [];
      cola.filter(x => ok.has(x.uid) && x.fallaId).sort((a, b) => a.cargado < b.cargado ? -1 : 1).forEach(x => {
        let it = lista.items.find(i => i.id === x.fallaId);
        if (!it && x.tipo === "trabajo" && x.descripcion) { lista.items.push(itemDeTrabajo(x)); return; }
        if (it && (!it.novedad || it.novedad.cargado <= x.cargado)) it.novedad = novDe(x);
      });
      guardar(K.lista, lista);
    }
    cola = cola.filter(x => !ok.has(x.uid)); guardar(K.cola, cola);
    if (ok.size) aviso(ok.size === 1 ? "Enviado" : `${ok.size} registros enviados`);
    ultimoError = "";
  } catch(e){ ultimoError = navigator.onLine ? "No se pudo enviar: " + e.message : ""; }
  enviando = false; pintar();
  if (cola.length && navigator.onLine && !ultimoError) enviarCola();
}
async function sincronizar(){ await enviarCola(); await traerLista(); }

// ── pantalla ──
function pintarEstado(){
  if (!cfg) { $("estado").innerHTML = ""; return; }
  $("area").textContent = `${cfg.area} · ${cfg.usuario}`;
  const on = navigator.onLine;
  let h = `<span class="pill ${on ? "" : "off"}"><i></i>${on ? "Con señal" : "Sin señal: se guarda en el teléfono"}</span>`;
  if (cola.length) h += `<span class="pill cola">${cola.length} por enviar</span>`;
  if (enviando) h += `<span class="pill">Enviando…</span>`;
  else if (cargando) h += `<span class="pill">Actualizando…</span>`;
  else if (lista) h += `<span class="pill">Lista de ${cuando(lista.generado)}</span>`;
  $("estado").innerHTML = h;
}
function novedadDe(it){
  const loc = cola.filter(x => x.fallaId === it.id).sort((a, b) => a.cargado < b.cargado ? 1 : -1)[0];
  if (loc) return {...novDe(loc), pendiente: true};
  return it.novedad;
}
function tarjeta(it){
  const n = novedadDe(it);
  const trab = it.tipo === "trabajo";
  const det = /^(Sí|Parcial)/.test(it.detenido);
  let nov, sinHoy = false;
  if (n && esHoy(n.cargado)) {
    const cls = n.pendiente ? "pend" : (n.definicion ? "def" : "");
    nov = `<div class="nov ${cls}"><b>${esc(n.estado)}</b>${n.definicion ? " · Buscar definición" : ""} · ${cuando(n.cargado)}${n.pendiente ? " · por enviar" : ""}${n.nota ? `<br>${esc(n.nota)}` : ""}</div>`;
  } else {
    sinHoy = true;
    nov = `<div class="nov falta">Sin novedad hoy${n ? ` · última: ${esc(n.estado)} (${cuando(n.cargado)})` : ""}</div>`;
  }
  if (n && n.asignados && n.asignados.length) nov += `<div class="chips"><span class="chip">Asignado: ${esc(n.asignados.join(", "))}</span></div>`;
  if (!trab && n && n.estado === "Resuelta" && esHoy(n.cargado)) nov += `<div class="chips"><span class="chip">Falta cerrar en el CMMS</span></div>`;
  const chips = trab
    ? `<span class="chip trab">Trabajo</span>${it.equipo ? `<span class="chip">${esc(it.equipo)}</span>` : ""}${n && CIERRE_TRABAJO.includes(n.estado) ? `<span class="chip ok">${esc(n.estado)}</span>` : ""}`
    : `${det ? `<span class="chip det">${esc(it.detenido)}</span>` : ""}${it.ot ? `<span class="chip">${esc(it.ot)}</span>` : `<span class="chip">Sin OT</span>`}${it.subestado ? `<span class="chip">${esc(it.subestado)}</span>` : ""}`;
  const html = `<button class="card ${trab ? "trab" : (det ? "det" : "")}" type="button" data-id="${esc(it.id)}">
    <div class="t"><span class="eq">${esc(trab ? corto(it.sintoma, 70) : it.equipo)}</span><span class="dias">${esc(it.planta)} · ${hace(it.desde)}</span></div>
    ${trab ? "" : `<div class="sin">${esc(it.sintoma)}</div>`}
    <div class="chips">${chips}</div>
    ${nov}</button>`;
  return {html, sinHoy};
}
function pintar(){
  pintarEstado();
  document.querySelector(".pie").hidden = !cfg;
  if (!cfg) return;
  const el = $("lista");
  if (!lista){ el.innerHTML = ultimoError ? `<p class="err">${esc(ultimoError)}</p><p class="vacio">Toque «Actualizar» para reintentar, o toque su nombre arriba para revisar la configuración.</p>`
    : `<p class="vacio">${!navigator.onLine ? "Sin señal. La lista aparece la primera vez que haya señal." : (cargando ? "Cargando la lista…" : "Toque «Actualizar» para cargar la lista.")}</p>`; return; }
  const lim = desdeFiltro(filtro);
  const todos = todosLosItems();
  const vis = lim ? todos.filter(x => new Date(x.desde) >= lim) : todos;
  const fallas = vis.filter(x => x.tipo !== "trabajo").map(tarjeta);
  const trabajos = vis.filter(x => x.tipo === "trabajo").map(tarjeta);
  const sinHoy = fallas.concat(trabajos).filter(x => x.sinHoy).length;
  const gen = cola.filter(x => !x.fallaId).length;
  const per = {hoy: " de hoy", semana: " de esta semana", mes: " de este mes", todas: ""}[filtro];
  el.innerHTML = (ultimoError ? `<p class="err">${esc(ultimoError)}</p>` : "") +
    `<div class="filtro" id="filtro">${FILTROS.map(([k, t]) => `<button type="button" data-f="${k}" aria-pressed="${k === filtro}">${t}</button>`).join("")}</div>` +
    `<div class="resumen">${fallas.length} fallas · ${trabajos.length} trabajos${per} · <b>${sinHoy} sin novedad hoy</b>${gen ? ` · ${gen} novedad general por enviar` : ""}</div>` +
    (fallas.length ? fallas.map(x => x.html).join("") : `<p class="vacio">${lim ? "No hay fallas abiertas reportadas en este período." : `No hay fallas abiertas en ${esc(cfg.area)}.`}</p>`) +
    (trabajos.length ? `<div class="resumen"><b>Trabajos</b></div>` + trabajos.map(x => x.html).join("") : "");
}

// ── piezas de formulario ──
function botonesTecnicos(sel){
  const tecs = (lista && lista.tecnicos) || [];
  return tecs.length ? `<div class="tit">Asignado a (puede elegir varios)</div><div class="tecs" id="tecs">${tecs.map(t => `<button type="button" aria-pressed="${sel.has(t)}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : "";
}
function activarTecnicos(sel, alCambiar){
  if (!$("tecs")) return;
  $("tecs").onclick = e => { const b = e.target.closest("button"); if (!b) return;
    const t = b.dataset.t; if (sel.has(t)) sel.delete(t); else sel.add(t); b.setAttribute("aria-pressed", String(sel.has(t))); if (alCambiar) alCambiar(); };
}
function elegirUno(id, alElegir){
  $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return;
    $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); alElegir(b.dataset.e); };
}
function encolar(item, msjOk){
  cola.push({uid: uid(), cargado: new Date().toISOString(), ...item});
  guardar(K.cola, cola); cerrar(); pintar();
  aviso(navigator.onLine ? (msjOk || "Guardado. Enviando…") : "Guardado en el teléfono. Se envía al volver la señal.");
  enviarCola();
}
const pieForm = () => `<div class="acc"><button type="button" class="sec" id="cancelar">Cancelar</button><button type="button" class="prim" id="guardar" disabled>Guardar</button></div>`;
function activarCierre(){ $("cancelar").onclick = cerrar; $("velo").onclick = e => { if (e.target.id === "velo") cerrar(); }; }

// ── novedad sobre una falla, un trabajo existente o general ──
function abrirCarga(it){
  let estado = "", definicion = false;
  const trab = it && it.tipo === "trabajo";
  const previa = it ? novedadDe(it) : null;
  const asignados = new Set(previa && previa.asignados ? previa.asignados : []);
  const titulo = it ? esc(trab ? corto(it.sintoma, 80) : it.equipo) : "Novedad general";
  const sub = it ? esc(trab ? `Trabajo · ${it.planta}${it.equipo ? " · " + it.equipo : ""}` : it.sintoma) : "Algo que no está ligado a una falla ni a un trabajo: falta de personal, un problema de la planta, un pedido.";
  const opciones = !it ? ESTADOS_GENERAL : (trab ? ESTADOS_TRABAJO : ESTADOS_FALLA);
  $("capa").innerHTML = `<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="Cargar novedad">
    <h2>${titulo}</h2><p class="sub">${sub}</p>
    <div class="opc" id="opc">${opciones.map(e => `<button type="button" class="${e === "Resuelta" || CIERRE_TRABAJO.includes(e) ? "res" : ""}" aria-pressed="false" data-e="${esc(e)}">${esc(e)}</button>`).join("")}</div>
    ${botonesTecnicos(asignados)}
    <button type="button" class="ger" id="ger" aria-pressed="false"><span class="caja"></span>Buscar definición</button>
    <label>Nota (opcional)<textarea id="nota" maxlength="300" placeholder="Ej.: llega el rodamiento mañana; falta un técnico en el turno noche"></textarea></label>
    ${pieForm()}</div></div>`;
  const notaVacia = () => !$("nota").value.trim();
  const listo = () => {
    const ot = estado === "Pasó a OT";
    $("nota").placeholder = ot ? "Número de OT (obligatorio). Ej.: OT-2026-10250" : "Ej.: llega el rodamiento mañana; falta un técnico en el turno noche";
    $("guardar").disabled = !(estado || (!it && !notaVacia())) || (ot && notaVacia());
  };
  elegirUno("opc", e => { estado = e; listo(); });
  activarTecnicos(asignados);
  $("ger").onclick = () => { definicion = !definicion; $("ger").setAttribute("aria-pressed", String(definicion)); };
  $("nota").oninput = listo;
  activarCierre();
  $("guardar").onclick = () => encolar({tipo: trab ? "trabajo" : (it ? "falla" : "general"), fallaId: it ? it.id : "",
    equipo: it ? it.equipo : "", planta: it ? it.planta : "", ot: it ? it.ot : "", descripcion: "",
    estado: estado || "Nota", definicion, nota: $("nota").value.trim(), asignados: [...asignados]});
}

// ── trabajo nuevo (no es una falla) ──
function abrirTrabajo(){
  let planta = "", estado = "En curso";
  const asignados = new Set(((lista && lista.tecnicos) || []).includes(cfg.usuario) ? [cfg.usuario] : []);
  const plantas = PLANTAS[cfg.area] || [];
  if (plantas.length === 1) planta = plantas[0];
  $("capa").innerHTML = `<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="Nuevo trabajo">
    <h2>Nuevo trabajo</h2><p class="sub">Un trabajo que no es una falla. Ej.: soldar estructura de cañerías en Planta 5. Si ya lo terminó, elija «Terminado».</p>
    <label>Qué trabajo<textarea id="desc" maxlength="200" placeholder="Ej.: Soldar estructura de cañerías de agua"></textarea></label>
    <div class="tit">Planta</div><div class="selp" id="plantas">${plantas.map(p => `<button type="button" aria-pressed="${p === planta}" data-e="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <label>Equipo o lugar (opcional)<input id="lugar" maxlength="80" placeholder="Ej.: sector chillers, techo depósito"></label>
    ${botonesTecnicos(asignados)}
    <div class="tit">Estado</div><div class="selp" id="est">${["Pendiente", "En curso", "Terminado"].map(e => `<button type="button" class="${e === "Terminado" ? "fin" : ""}" aria-pressed="${e === estado}" data-e="${e}">${e}</button>`).join("")}</div>
    ${pieForm()}</div></div>`;
  const tecs = (lista && lista.tecnicos) || [];
  const listo = () => $("guardar").disabled = !($("desc").value.trim() && planta && (asignados.size || !tecs.length));
  elegirUno("plantas", e => { planta = e; listo(); });
  elegirUno("est", e => { estado = e; });
  activarTecnicos(asignados, listo);
  $("desc").oninput = listo;
  activarCierre();
  listo();
  $("guardar").onclick = () => encolar({tipo: "trabajo", fallaId: "T-" + uid(), equipo: $("lugar").value.trim(), planta, ot: "",
    descripcion: $("desc").value.trim(), estado, definicion: false, nota: "", asignados: [...asignados]}, "Trabajo guardado. Enviando…");
}
function cerrar(){ $("capa").innerHTML = ""; }

// ── configuración (primera vez) ──
function pantallaConfig(){
  const c = cfg || {url: "", clave: "", usuario: "", area: "Plantas 3-4-5"};
  $("lista").innerHTML = `<div class="hoja" style="border-radius:12px;max-height:none">
    <h2>Configurar la app</h2><p class="sub">Se hace una sola vez. Los datos los da Gerencia Técnica.</p>
    <label>Su nombre<input id="cUsu" value="${esc(c.usuario)}" autocomplete="name"></label>
    <label>Área<select id="cArea" style="font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)">${AREAS.map(a => `<option ${a === c.area ? "selected" : ""}>${a}</option>`).join("")}</select></label>
    <label>Dirección del servicio<input id="cUrl" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"></label>
    <label>Clave<input id="cClave" value="${esc(c.clave)}" autocomplete="off"></label>
    <p class="err" id="cErr"></p>
    <div class="acc"><button type="button" class="prim" id="cOk">Guardar y entrar</button></div></div>`;
  document.querySelector(".pie").hidden = true;
  $("cOk").onclick = () => {
    const n = {usuario: $("cUsu").value.trim(), area: $("cArea").value, url: $("cUrl").value.trim(), clave: $("cClave").value.trim()};
    if (!n.usuario || !n.clave || !/^https:\/\//.test(n.url)) { $("cErr").textContent = "Complete nombre, dirección (https://…) y clave."; return; }
    if (cfg && cfg.area !== n.area) { lista = null; guardar(K.lista, null); }
    cfg = n; guardar(K.cfg, cfg); pintar(); sincronizar();
  };
}

// ── eventos ──
$("lista").addEventListener("click", e => {
  const f = e.target.closest("#filtro button");
  if (f){ filtro = f.dataset.f; guardar(K.filtro, filtro); pintar(); return; }
  const b = e.target.closest(".card"); if (!b || !lista) return;
  const it = todosLosItems().find(x => x.id === b.dataset.id); if (it) abrirCarga(it);
});
$("btnGeneral").onclick = () => cfg && abrirCarga(null);
$("btnTrabajo").onclick = () => cfg && abrirTrabajo();
$("btnAct").onclick = () => cfg ? sincronizar() : null;
$("area").addEventListener("click", pantallaConfig);  // tocar el área/nombre abre la configuración; la cola no se pierde
window.addEventListener("online", () => { pintar(); sincronizar(); });
window.addEventListener("offline", pintar);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sincronizar(); });
setInterval(() => { if (navigator.onLine) sincronizar(); }, 120000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw-novedades.js").catch(() => {});
if (!cfg) pantallaConfig(); else { pintar(); sincronizar(); }
</script>
</body>
</html>
