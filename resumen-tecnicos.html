<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#14110e">
<title>Cimplast · Resumen de Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#14110e; --surface:#1d1915; --surface2:#282219; --surface3:#332b21;
  --border:#3a3126; --border-hi:#544736;
  --accent:#f0a92c; --accent-soft:rgba(240,169,44,.13);
  --danger:#e5574f; --ok:#5cb46b; --info:#5b9bd5; --warn:#e0a33a;
  --text:#f6f1e8; --label:#c4b8a8; --muted:#8d8175;
  --font:'Archivo',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:10px; --r-lg:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding-bottom:24px}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ── TOPBAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:50}
.topbar-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:grid;place-items:center;font-size:16px;font-weight:800;color:#1a1409;flex-shrink:0}
.topbar-title{flex:1;min-width:0}
.topbar-title b{font-size:14px;font-weight:700;display:block}
.topbar-title span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.btn-refresh{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:16px;flex-shrink:0}
.btn-refresh.spinning{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:6px}
.tab-btn{flex:1;padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:700;text-align:center;background:var(--surface2);border:1px solid var(--border);color:var(--muted);transition:.15s}
.tab-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.date-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.date-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;flex-shrink:0;font-size:14px;color:var(--label);display:flex;align-items:center;justify-content:center}
.date-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:13px;text-align:center}
.date-today-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:700;color:var(--muted);flex-shrink:0}

/* ── CONTENT ── */
.content{padding:14px}
.section-lbl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 8px}
.section-lbl:first-child{margin-top:0}

/* ── TÉCNICO CARD ── */
.tec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden}
.tec-card-h{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.tec-avatar{width:38px;height:38px;border-radius:100px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--accent);flex-shrink:0}
.tec-info{flex:1;min-width:0}
.tec-info b{font-size:14px;display:block;line-height:1.3}
.tec-info span{font-size:11px;color:var(--muted)}
.tec-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
.tec-badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:100px;font-family:var(--mono)}
.tec-badge.open{background:rgba(240,169,44,.15);color:var(--accent);border:1px solid rgba(240,169,44,.3)}
.tec-badge.today{background:rgba(91,155,213,.15);color:var(--info);border:1px solid rgba(91,155,213,.3)}
.tec-chevron{color:var(--muted);font-size:11px;transition:transform .2s;flex-shrink:0}
.tec-card.expanded .tec-chevron{transform:rotate(90deg)}
.tec-card-body{display:none;border-top:1px solid var(--border);padding:10px 14px 14px}
.tec-card.expanded .tec-card-body{display:block}

.tec-subhead{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.tec-subhead:first-child{margin-top:2px}

/* ── OT ROW ── */
.ot-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.ot-row.alta{border-left:3px solid var(--danger)}
.ot-row-main{flex:1;min-width:0}
.ot-row-eq{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ot-row-meta{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.ot-row-tag{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:100px;flex-shrink:0}
.tag-alta{background:rgba(229,87,79,.15);color:#f0938c}
.tag-media{background:rgba(240,169,44,.15);color:var(--accent)}
.tag-baja{background:var(--surface3);color:var(--muted)}
.empty-msg{font-size:11.5px;color:var(--muted);padding:8px 2px;text-align:center}

/* ── DÍA VIEW ── */
.dia-tecnico-group{margin-bottom:14px}
.dia-tecnico-h{display:flex;align-items:center;gap:8px;padding:6px 2px;margin-bottom:6px}
.dia-tecnico-h b{font-size:12.5px;color:var(--text)}
.dia-tecnico-h span{font-size:10px;color:var(--muted)}

/* ── LOADING / ESTADO ── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--muted);font-size:13px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.status-line{text-align:center;font-size:10.5px;color:var(--muted);padding:10px 0 2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-top">
    <div class="logo-mark">C</div>
    <div class="topbar-title"><b>Resumen de Técnicos</b><span>Cimplast · Mantenimiento</span></div>
    <button class="btn-refresh" id="btnRefresh" onclick="cargarDatos()">↻</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabTecnico" onclick="setTab('tecnico')">👤 Por técnico</button>
    <button class="tab-btn" id="tabDia" onclick="setTab('dia')">📅 Por día</button>
  </div>
  <div class="date-row" id="dateRow">
    <button class="date-nav-btn" onclick="navDia(-1)">‹</button>
    <input type="date" class="date-input" id="fechaSel" onchange="render()">
    <button class="date-nav-btn" onclick="navDia(1)">›</button>
    <button class="date-today-btn" onclick="irHoy()">Hoy</button>
  </div>
</div>

<div class="content" id="content">
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <span>Cargando datos…</span>
  </div>
</div>
<div class="status-line" id="statusLine"></div>

<script src="datos.js"></script>
<script>
const API = window.CIMPLAST_DATA.api;
const D = window.CIMPLAST_DATA;
const TECNICOS = window.CIMPLAST_DATA.tecnicos;

let otsTodas = [];
let tabActiva = 'tecnico';
let expandidos = new Set();

document.addEventListener('DOMContentLoaded', () => {
  irHoy();
  cargarDatos();
});

function irHoy(){
  document.getElementById('fechaSel').value = new Date().toISOString().slice(0,10);
  render();
}

function navDia(dir){
  const inp = document.getElementById('fechaSel');
  const d = new Date(inp.value + 'T00:00:00');
  d.setDate(d.getDate() + dir);
  inp.value = d.toISOString().slice(0,10);
  render();
}

function setTab(tab){
  tabActiva = tab;
  document.getElementById('tabTecnico').classList.toggle('active', tab==='tecnico');
  document.getElementById('tabDia').classList.toggle('active', tab==='dia');
  document.getElementById('dateRow').style.display = tab==='dia' ? 'flex' : 'none';
  render();
}

async function cargarDatos(){
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('spinning');
  try{
    const r = await fetch(API + '?accion=ots');
    const d = await r.json();
    otsTodas = d.ots || [];
    document.getElementById('statusLine').textContent = otsTodas.length + ' OT cargadas · actualizado ' + new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('statusLine').textContent = 'Sin conexión — mostrando último dato disponible';
  }
  btn.classList.remove('spinning');
  render();
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function otsDeTecnico(nombreTec){
  return otsTodas.filter(o => D.tieneTecnico(o.Tecnico, nombreTec));
}

function ordenarPorPrioridad(arr){
  const peso = p => p==='Alta'?0:p==='Media'?1:2;
  return [...arr].sort((a,b) => peso(a.Prioridad) - peso(b.Prioridad));
}

function otRowHTML(o){
  const p = o.Prioridad || 'Media';
  const cls = p==='Alta'?'tag-alta':p==='Baja'?'tag-baja':'tag-media';
  const estadoTxt = o.Estado==='En curso' ? 'En curso' : 'Abierta';
  return `<div class="ot-row${p==='Alta'?' alta':''}">
    <div class="ot-row-main">
      <div class="ot-row-eq">${esc(o.Equipo||'—')}</div>
      <div class="ot-row-meta">${esc(o.NroOT||'—')} · ${esc(o.Planta||'—')} · ${estadoTxt}${o.FechaProgramada?' · '+D.fmtFecha(o.FechaProgramada):''}</div>
    </div>
    <span class="ot-row-tag ${cls}">${esc(p)}</span>
  </div>`;
}

function render(){
  document.getElementById('loadingState').style.display = 'none';
  if(tabActiva === 'tecnico') renderPorTecnico();
  else renderPorDia();
}

function renderPorTecnico(){
  const cont = document.getElementById('content');
  const hoyStr = document.getElementById('fechaSel')?.value || new Date().toISOString().slice(0,10);

  const html = TECNICOS.map(t => {
    const nombre = t.nombre;
    const misOts = otsDeTecnico(nombre);
    const abiertas = ordenarPorPrioridad(misOts.filter(o => o.Estado !== 'Cerrada'));
    const deHoy = abiertas.filter(o => (o.FechaProgramada||'').slice(0,10) === hoyStr);
    const expandido = expandidos.has(nombre);
    const iniciales = nombre.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

    const bodyHTML = expandido ? `
      <div class="tec-card-body">
        <div class="tec-subhead">Programadas para hoy (${D.fmtFecha(hoyStr)})</div>
        ${deHoy.length ? deHoy.map(otRowHTML).join('') : '<div class="empty-msg">Sin tareas programadas para hoy</div>'}
        <div class="tec-subhead">Todas las OT abiertas (${abiertas.length})</div>
        ${abiertas.length ? abiertas.map(otRowHTML).join('') : '<div class="empty-msg">Sin OT abiertas</div>'}
      </div>` : '';

    return `<div class="tec-card${expandido?' expanded':''}" data-tec="${esc(nombre)}">
      <div class="tec-card-h" onclick="toggleTecnico('${esc(nombre)}')">
        <div class="tec-avatar">${iniciales}</div>
        <div class="tec-info"><b>${esc(nombre)}</b><span>${esc(t.especialidad||t.esp||'')}</span></div>
        <div class="tec-badges">
          ${deHoy.length ? `<span class="tec-badge today">${deHoy.length} hoy</span>` : ''}
          <span class="tec-badge open">${abiertas.length} abiertas</span>
        </div>
        <span class="tec-chevron">▶</span>
      </div>
      ${bodyHTML}
    </div>`;
  }).join('');

  cont.innerHTML = html;
}

function toggleTecnico(nombre){
  if(expandidos.has(nombre)) expandidos.delete(nombre);
  else expandidos.add(nombre);
  renderPorTecnico();
}

function renderPorDia(){
  const cont = document.getElementById('content');
  const fecha = document.getElementById('fechaSel').value;

  const otsDelDia = otsTodas.filter(o => (o.FechaProgramada||'').slice(0,10) === fecha);
  const porTecnico = {};
  otsDelDia.forEach(o => {
    (o.Tecnico||'Sin asignar').split(',').map(t=>t.trim()).filter(Boolean).forEach(tec => {
      if(!porTecnico[tec]) porTecnico[tec] = [];
      porTecnico[tec].push(o);
    });
  });

  const nombresConTareas = Object.keys(porTecnico).sort();

  if(nombresConTareas.length === 0){
    cont.innerHTML = '<div class="empty-msg" style="padding:40px 10px;font-size:13px">Sin OT programadas para este día</div>';
    return;
  }

  const html = nombresConTareas.map(tec => {
    const ots = ordenarPorPrioridad(porTecnico[tec]);
    return `<div class="dia-tecnico-group">
      <div class="dia-tecnico-h"><b>👤 ${esc(tec)}</b><span>· ${ots.length} OT</span></div>
      ${ots.map(otRowHTML).join('')}
    </div>`;
  }).join('');

  cont.innerHTML = html;
}
</script>
</body>
</html>
