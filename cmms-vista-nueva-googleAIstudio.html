<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cimplast CMMS - Vista Nueva (Prueba)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --slate-950:#020618; --slate-900:#0f172b; --slate-800:#1d293d; --slate-700:#314158;
  --slate-600:#45556c; --slate-500:#62748e; --slate-400:#90a1b9; --slate-300:#cad5e2;
  --slate-200:#e2e8f0; --slate-100:#f1f5f9;
  --cyan-600:#0092b8; --cyan-500:#00a6c8; --cyan-400:#4ac0dc; --cyan-300:#8ad9ec;
  --amber-950:#461901; --amber-900:#7b3306; --amber-800:#953d00; --amber-400:#f0b136; --amber-300:#f7cc4a;
  --rose-950:#4d0218; --rose-900:#78052b; --rose-800:#a30037; --rose-400:#fb3a5d; --rose-300:#ff96a8;
  --emerald-950:#002c22; --emerald-900:#004e3b; --emerald-800:#00694f; --emerald-500:#00a878; --emerald-400:#31d19a;
  --radius-lg:.5rem; --radius-xl:.75rem;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--slate-950); color:var(--slate-100);
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; flex-direction:column;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#94a3b840;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#94a3b873}

/* ── HEADER ── */
header{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  padding:.75rem 1.25rem; border-bottom:1px solid var(--slate-800);
  background:rgba(15,23,43,.9); backdrop-filter:blur(12px);
}
.brand{display:flex; align-items:center; gap:.75rem;}
.brand-icon{
  width:2.25rem; height:2.25rem; border-radius:var(--radius-lg); background:var(--cyan-600);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
  box-shadow:0 1px 8px rgba(0,146,184,.4);
}
.brand-name{font-weight:800; font-size:1rem; color:#fff; display:flex; align-items:center; gap:.5rem;}
.brand-tag{
  font-family:'JetBrains Mono',monospace; font-size:.7rem; font-weight:700; padding:.15rem .4rem;
  border-radius:.25rem; background:var(--slate-800); color:var(--cyan-400); border:1px solid var(--slate-700);
}
.brand-sub{font-size:.68rem; color:var(--slate-400); font-weight:500;}
.hdr-actions{display:flex; align-items:center; gap:.5rem;}
.btn{
  display:inline-flex; align-items:center; gap:.4rem; padding:.4rem .75rem; border-radius:.375rem;
  font-size:.72rem; font-weight:700; border:1px solid transparent; cursor:pointer; transition:all .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.95);}
.btn-cyan{background:var(--cyan-600); color:#fff; border-color:var(--cyan-500);}
.btn-cyan:hover{background:var(--cyan-500);}
.btn-icon{
  padding:.4rem; border-radius:.375rem; color:var(--slate-400); background:transparent;
  border:1px solid var(--slate-700); cursor:pointer;
}
.btn-icon:hover{color:var(--slate-200); background:var(--slate-800);}

/* ── KPI STRIP ── */
.kpis{padding:1rem 1.25rem .5rem; display:grid; grid-template-columns:repeat(2,1fr); gap:.75rem;}
@media(min-width:640px){.kpis{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1024px){.kpis{grid-template-columns:repeat(6,1fr);}}
.kpi{
  background:rgba(15,23,43,.8); border:1px solid var(--slate-800); border-radius:var(--radius-lg);
  padding:.75rem; display:flex; flex-direction:column; transition:border-color .15s;
}
.kpi:hover{border-color:var(--slate-700);}
.kpi-label{font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--slate-400);}
.kpi-value{font-family:'JetBrains Mono',monospace; font-size:1.4rem; font-weight:700; color:#fff; margin-top:auto;}
.kpi-unit{font-size:.72rem; font-weight:600; color:var(--slate-400); margin-left:.15rem;}
.kpi-sub{font-size:.65rem; color:var(--slate-400); margin-top:.15rem;}
.kpi-bar{height:2px; width:100%; margin-top:.5rem; border-radius:999px;}
.bar-emerald{background:var(--emerald-500);} .bar-cyan{background:var(--cyan-500);} .bar-rose{background:var(--rose-400);}
.kpi-danger{background:rgba(77,2,24,.4); border-color:rgba(163,0,55,.8);}
.kpi-danger .kpi-label{color:var(--rose-300);}
.kpi-danger .kpi-value{color:var(--rose-300);}

/* ── TOOLBAR ── */
.toolbar{
  padding:.6rem 1.25rem; background:rgba(15,23,43,.6); border-bottom:1px solid var(--slate-800);
  display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; justify-content:space-between;
}
.tb-left{display:flex; flex-wrap:wrap; align-items:center; gap:.5rem;}
.search-wrap{position:relative; min-width:200px;}
.search-wrap input{
  width:100%; background:var(--slate-800); border:1px solid var(--slate-700); border-radius:.375rem;
  padding:.4rem .6rem .4rem 2rem; font-size:.72rem; color:var(--slate-100);
}
.search-wrap input::placeholder{color:var(--slate-400);}
.search-wrap input:focus{outline:none; border-color:var(--cyan-500);}
.search-icon{position:absolute; left:.6rem; top:50%; transform:translateY(-50%); color:var(--slate-400); font-size:.8rem; pointer-events:none;}
select.tb-select{
  background:var(--slate-800); border:1px solid var(--slate-700); border-radius:.375rem;
  padding:.4rem .6rem; font-size:.72rem; color:var(--slate-200); cursor:pointer;
}
select.tb-select:focus{outline:none; border-color:var(--cyan-500);}
.tb-count{font-size:.68rem; color:var(--slate-400); font-family:'JetBrains Mono',monospace;}
.tb-count b{color:var(--slate-200);}

/* ── MAIN LAYOUT ── */
main{flex:1; display:flex; flex-direction:column; overflow:hidden;}
.grid-main{
  flex:1; padding:1rem 1.25rem; display:grid; gap:1.25rem; overflow:hidden;
  grid-template-columns:1fr;
}
@media(min-width:1024px){.grid-main{grid-template-columns:1fr 2fr;}}

.panel{
  display:flex; flex-direction:column; background:rgba(15,23,43,.9); border:1px solid var(--slate-800);
  border-radius:.75rem; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.2);
  height:100%; max-height:calc(100vh - 230px);
}
.panel-head{
  padding:.85rem; border-bottom:1px solid var(--slate-800); background:rgba(29,41,61,.4);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.panel-title{display:flex; align-items:center; gap:.5rem; font-size:.72rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em; color:var(--slate-200);}
.dot{width:.5rem; height:.5rem; border-radius:999px;}
.dot-amber{background:var(--amber-400); animation:pulse 2s infinite;}
.dot-cyan{background:var(--cyan-400);}
.dot-emerald{background:var(--emerald-400);}
@keyframes pulse{50%{opacity:.4;}}
.panel-count{font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--slate-400);}
.panel-body{flex:1; overflow-y:auto; padding:.75rem; display:flex; flex-direction:column; gap:.65rem;}

/* ── FALLA / OT CARD ── */
.card{
  padding:.75rem; border-radius:.5rem; border:1px solid var(--slate-700); background:rgba(29,41,61,.7);
  transition:all .15s; cursor:pointer;
}
.card:hover{background:var(--slate-800); border-color:var(--slate-600);}
.card-urgente{background:rgba(77,2,24,.2); border-color:rgba(163,0,55,.8);}
.card-header{display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.4rem;}
.card-id{font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:700; color:var(--cyan-400);}
.chip{font-size:.65rem; font-weight:700; padding:.1rem .45rem; border-radius:.25rem; white-space:nowrap;}
.chip-rose{color:var(--rose-300); background:var(--rose-950); border:1px solid var(--rose-800);}
.chip-amber{color:var(--amber-300); background:var(--amber-950); border:1px solid var(--amber-800);}
.chip-slate{color:var(--slate-400); background:var(--slate-900); border:1px solid var(--slate-800);}
.chip-emerald{color:var(--emerald-400); background:var(--emerald-950); border:1px solid var(--emerald-800);}
.card-title{font-weight:700; font-size:.8rem; color:var(--slate-100); line-height:1.3;}
.card-meta{font-size:.68rem; color:var(--slate-400); margin-top:.15rem; display:flex; gap:.4rem; align-items:center;}
.card-meta .cy{color:var(--cyan-400); font-weight:500;}
.card-body{
  font-size:.7rem; color:var(--slate-300); line-height:1.5; margin:.5rem 0; background:rgba(15,23,43,.6);
  padding:.5rem; border-radius:.375rem; border:1px solid rgba(29,41,61,.6);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card-footer{
  display:flex; align-items:center; justify-content:space-between; font-size:.68rem; color:var(--slate-400);
  padding-top:.4rem; border-top:1px solid rgba(29,41,61,.8);
}
.card-actions{display:flex; align-items:center; gap:.4rem; margin-top:.6rem; padding-top:.5rem; border-top:1px solid rgba(29,41,61,.6);}
.card-actions .btn{flex:1; justify-content:center; padding:.3rem .4rem; font-size:.68rem;}
.btn-slate{background:rgba(69,85,108,.6); color:var(--cyan-300);}
.btn-slate:hover{background:var(--slate-700);}
.btn-emerald{background:rgba(0,44,34,.6); color:var(--emerald-400); border:1px solid rgba(0,105,79,.6);}
.btn-emerald:hover{background:rgba(0,78,59,.8);}
.subestado-chip{
  display:inline-flex; align-items:center; gap:.3rem; font-size:.65rem; font-weight:600; padding:.15rem .5rem;
  border-radius:.25rem; background:rgba(70,25,1,.5); color:var(--amber-300); border:1px solid rgba(149,61,0,.6);
  margin:.35rem 0;
}
.card-tag{font-size:.65rem; font-weight:500; color:var(--slate-400); background:var(--slate-900);
  padding:.1rem .45rem; border-radius:.25rem; border:1px solid var(--slate-800);}

/* ── KANBAN 3 columnas ── */
.kanban{display:grid; grid-template-columns:1fr; gap:1rem; height:100%;}
@media(min-width:768px){.kanban{grid-template-columns:repeat(3,1fr);}}

.empty-msg{font-size:.72rem; color:var(--slate-500); text-align:center; padding:2rem 1rem;}

/* ── modal simple ── */
.modal-overlay{
  position:fixed; inset:0; background:rgba(2,6,24,.7); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:50; padding:1rem;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--slate-900); border:1px solid var(--slate-700); border-radius:.75rem;
  max-width:480px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 25px 50px rgba(0,0,0,.4);
}
.modal-head{padding:1rem; border-bottom:1px solid var(--slate-800); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-size:.9rem; font-weight:700;}
.modal-close{cursor:pointer; color:var(--slate-400); font-size:1.1rem; background:none; border:none;}
.modal-body{padding:1rem; font-size:.78rem; color:var(--slate-300); line-height:1.6;}
.modal-body dl{display:grid; grid-template-columns:auto 1fr; gap:.4rem .75rem; margin-bottom:.75rem;}
.modal-body dt{color:var(--slate-500); font-weight:600;}
.modal-body dd{color:var(--slate-200);}

.status-banner{
  font-size:.72rem; padding:.5rem .75rem; border-radius:.375rem; margin-bottom:1rem; display:none;
}
.status-banner.show{display:block;}
.status-ok{background:rgba(0,78,59,.4); border:1px solid var(--emerald-800); color:var(--emerald-400);}
.status-err{background:rgba(77,2,24,.4); border:1px solid var(--rose-800); color:var(--rose-300);}
</style>
</head>
<body>

<div id="pantalla-clave" style="position:fixed;inset:0;background:var(--slate-950);z-index:100;display:flex;align-items:center;justify-content:center;">
  <div style="background:var(--slate-900);border:1px solid var(--slate-700);border-radius:.75rem;padding:2rem;max-width:320px;width:90%;text-align:center;">
    <div style="font-weight:800;font-size:1.1rem;margin-bottom:.25rem;">Cimplast CMMS</div>
    <div style="font-size:.7rem;color:var(--slate-400);margin-bottom:1.25rem;">Vista de prueba — acceso con la clave de Supervisores</div>
    <input id="input-clave" type="password" placeholder="Clave" style="width:100%;background:var(--slate-800);border:1px solid var(--slate-700);border-radius:.375rem;padding:.6rem;color:#fff;font-size:.85rem;margin-bottom:.75rem;text-align:center;">
    <button id="btn-entrar" class="btn btn-cyan" style="width:100%;justify-content:center;padding:.6rem;">Entrar</button>
    <div id="clave-error" style="color:var(--rose-400);font-size:.7rem;margin-top:.5rem;display:none;">Clave incorrecta</div>
  </div>
</div>

<header>
  <div class="brand">
    <div class="brand-icon">C</div>
    <div>
      <div class="brand-name">Cimplast <span class="brand-tag">CMMS</span></div>
      <div class="brand-sub">Vista nueva — en prueba</div>
    </div>
  </div>
  <div class="hdr-actions">
    <button class="btn-icon" id="btnRecargar" title="Recargar datos">⟳</button>
  </div>
</header>

<section class="kpis" id="kpisRow"></section>

<div class="toolbar">
  <div class="tb-left">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="fBusqueda" type="text" placeholder="Buscar máquina, síntoma o N° OT...">
    </div>
    <select id="fPlanta" class="tb-select"><option value="">Todas las plantas</option></select>
    <select id="fPrioridad" class="tb-select">
      <option value="">Toda prioridad</option>
      <option value="Alta">Alta</option>
      <option value="Media">Media</option>
      <option value="Baja">Baja</option>
    </select>
  </div>
  <div class="tb-count" id="tbCount">— fallas · — OTs</div>
</div>

<main>
  <div class="grid-main">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot dot-amber"></span>Fallas Reportadas desde Planta</div>
        <span class="panel-count" id="fallasCount">0 total</span>
      </div>
      <div class="panel-body" id="listaFallas"></div>
    </div>

    <div class="panel" style="max-height:none;">
      <div class="panel-head">
        <div class="panel-title"><span class="dot dot-cyan"></span>Órdenes de Trabajo</div>
        <span class="panel-count" id="otsCount">0 total</span>
      </div>
      <div class="panel-body" style="padding:.85rem;">
        <div class="kanban">
          <div class="panel" style="max-height:none; box-shadow:none;">
            <div class="panel-head">
              <div class="panel-title"><span class="dot dot-cyan"></span>Abiertas</div>
              <span class="panel-count" id="colAbiertasCount">0</span>
            </div>
            <div class="panel-body" id="colAbiertas"></div>
          </div>
          <div class="panel" style="max-height:none; box-shadow:none;">
            <div class="panel-head">
              <div class="panel-title"><span class="dot dot-amber"></span>En Ejecución</div>
              <span class="panel-count" id="colCursoCount">0</span>
            </div>
            <div class="panel-body" id="colCurso"></div>
          </div>
          <div class="panel" style="max-height:none; box-shadow:none;">
            <div class="panel-head">
              <div class="panel-title"><span class="dot dot-emerald"></span>Cerradas</div>
              <span class="panel-count" id="colCerradasCount">0</span>
            </div>
            <div class="panel-body" id="colCerradas"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modalDetalle">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitulo">Detalle</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="datos.js"></script>
<script>
const D = window.CIMPLAST_DATA;
const API = D.api;
const CLAVE_APP = 'rcm2026x'; // misma clave que supervisores.html

// ── Pantalla de clave (localStorage, mismo patrón que las otras apps) ──
(function(){
  const KEY = 'cimplast_cmms_clave_ok_preview';
  if(localStorage.getItem(KEY) === '1'){
    document.getElementById('pantalla-clave').style.display='none';
  }
  document.getElementById('btn-entrar').onclick = () => {
    const v = document.getElementById('input-clave').value;
    if(v === CLAVE_APP){
      localStorage.setItem(KEY,'1');
      document.getElementById('pantalla-clave').style.display='none';
    } else {
      document.getElementById('clave-error').style.display='block';
    }
  };
  document.getElementById('input-clave').addEventListener('keydown', e => {
    if(e.key === 'Enter') document.getElementById('btn-entrar').click();
  });
})();

let fallasTodas = [], otsTodas = [];

function esc(s){ return D.esc(s); }

function cargarFiltros(){
  const selPlanta = document.getElementById('fPlanta');
  D.listaPlantas().forEach(p => {
    const o = document.createElement('option'); o.value = p; o.textContent = p;
    selPlanta.appendChild(o);
  });
}

async function cargarDatos(){
  try {
    const [rf, ro] = await Promise.all([
      fetch(D.apiGet('accion=fallas')).then(r => r.json()),
      fetch(D.apiGet('accion=ots')).then(r => r.json())
    ]);
    fallasTodas = rf.fallas || [];
    otsTodas = ro.ots || [];
    render();
  } catch(e) {
    document.getElementById('listaFallas').innerHTML = '<div class="empty-msg">Error cargando datos — revisá conexión.</div>';
    console.error(e);
  }
}

function aplicarFiltros(lista, campoPlanta){
  const q = document.getElementById('fBusqueda').value.trim().toLowerCase();
  const planta = document.getElementById('fPlanta').value;
  const prioridad = document.getElementById('fPrioridad').value;
  return lista.filter(o => {
    if(planta && o[campoPlanta] !== planta) return false;
    if(prioridad && o.Prioridad && o.Prioridad !== prioridad) return false;
    if(q){
      const blob = JSON.stringify(o).toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
}

function kpiCard(label, value, unit, sub, barClass, danger){
  return `<div class="kpi ${danger?'kpi-danger':''}">
    <div class="kpi-label">${label}</div>
    <div><span class="kpi-value">${value}</span><span class="kpi-unit">${unit||''}</span></div>
    <div class="kpi-sub">${sub}</div>
    <div class="kpi-bar ${barClass}"></div>
  </div>`;
}

function renderKPIs(){
  const dias = 30;
  const k = D.kpis(fallasTodas, otsTodas, dias);
  const paradas = fallasTodas.filter(f => f.Detenido === 'Parado' && f.Estado !== 'Concluido').length;
  document.getElementById('kpisRow').innerHTML = [
    kpiCard('Disponibilidad', k.disp.toFixed(1), '%', 'MTBF / (MTBF+MTTR)', 'bar-emerald'),
    kpiCard('MTBF', Math.round(k.mtbf), 'h', 'Tiempo medio entre fallas', 'bar-cyan'),
    kpiCard('MTTR', k.mttr.toFixed(1), 'h', 'Tiempo medio de reparación', 'bar-emerald'),
    kpiCard('Cumplimiento', Math.round(k.cumpl), '%', k.cerradas.length+' de '+k.validas.length+' OTs cerradas', k.cumpl<50?'bar-rose':'bar-cyan'),
    kpiCard('Backlog', k.backlog, 'OTs', 'Abiertas o en curso', 'bar-emerald'),
    kpiCard('Líneas Paradas', paradas, 'máq.', 'Atención urgente', 'bar-rose', paradas>0)
  ].join('');
}

function chipPrioridad(p){
  const cls = p==='Alta'?'chip-rose':p==='Baja'?'chip-slate':'chip-amber';
  return `<span class="chip ${cls}">${esc(p||'Media')}</span>`;
}

function cardFalla(f){
  const urgente = f.Detenido === 'Parado' && f.Estado !== 'Concluido';
  return `<div class="card ${urgente?'card-urgente':''}">
    <div class="card-header">
      <span class="card-id">${esc(f.ID)}</span>
      ${urgente?'<span class="chip chip-rose">⚠ Línea Parada</span>':(f.Detenido==='Parcial'?'<span class="chip chip-amber">Parada Parcial</span>':'')}
    </div>
    <div class="card-title">${esc(f.Equipo)}</div>
    <div class="card-meta"><span>${esc(f.Planta)}</span>·<span class="cy">${esc(f.Sistema)}</span></div>
    <div class="card-body">${esc(f.Sintoma)}</div>
    <div class="card-footer">
      <span>👤 ${esc(f.Operador)}</span>
      <span class="mono">${esc(D.fmtFechaHora(f.Fecha, f.Hora))}</span>
    </div>
    <div class="card-actions">
      <button class="btn btn-cyan" style="margin-left:auto;" onclick="alert('Generar OT — usa el flujo real en supervisores-preventivo.html')">🔧 Generar OT</button>
    </div>
  </div>`;
}

function cardOTNueva(o){
  const estado = D.estadoVisible ? D.estadoVisible(o) : o.Estado;
  const subChip = (o.SubEstado && o.Estado !== 'Cerrada')
    ? `<div class="subestado-chip">⏳ ${esc(o.SubEstado)}</div>` : '';
  return `<div class="card" onclick="verDetalleOT('${esc(o.NroOT)}')">
    <div class="card-header">
      <span class="card-id">${esc(o.NroOT)}</span>
      <div style="display:flex;gap:.3rem;">
        ${chipPrioridad(o.Prioridad)}
        <span class="card-tag">${esc(o.Tipo||'Correctivo')}</span>
      </div>
    </div>
    <div class="card-title">${esc(o.Equipo)}</div>
    ${subChip}
    <div class="card-body">${esc(o.Descripcion||'')}</div>
    <div class="card-footer">
      <span>👤 ${esc(o.Tecnico||'—')}</span>
      <span class="mono">${esc(D.fmtFecha(o.FechaProgramada))}</span>
    </div>
  </div>`;
}

function verDetalleOT(nroOT){
  const o = otsTodas.find(x => x.NroOT === nroOT);
  if(!o) return;
  document.getElementById('modalTitulo').textContent = o.NroOT;
  document.getElementById('modalBody').innerHTML = `
    <dl>
      <dt>Equipo</dt><dd>${esc(o.Equipo)}</dd>
      <dt>Planta</dt><dd>${esc(o.Planta)}</dd>
      <dt>Estado</dt><dd>${esc(D.estadoVisible ? D.estadoVisible(o) : o.Estado)}</dd>
      <dt>Prioridad</dt><dd>${esc(o.Prioridad)}</dd>
      <dt>Técnico</dt><dd>${esc(o.Tecnico||'—')}</dd>
      <dt>Programada</dt><dd>${esc(D.fmtFecha(o.FechaProgramada))}</dd>
    </dl>
    <p>${esc(o.Descripcion||'')}</p>
    <p style="margin-top:1rem; color:var(--slate-500); font-size:.68rem;">
      Vista de solo lectura — para editar/cerrar usá supervisores-preventivo.html
    </p>`;
  document.getElementById('modalDetalle').classList.add('show');
}
function cerrarModal(){ document.getElementById('modalDetalle').classList.remove('show'); }

function render(){
  renderKPIs();

  const fallasF = aplicarFiltros(fallasTodas, 'Planta').filter(f => f.Estado !== 'Concluido');
  const otsF = aplicarFiltros(otsTodas, 'Planta');

  document.getElementById('fallasCount').textContent = fallasF.length + ' total';
  document.getElementById('otsCount').textContent = otsF.length + ' total';
  document.getElementById('tbCount').innerHTML = `<b>${fallasTodas.length}</b> fallas · <b>${otsTodas.length}</b> OTs`;

  document.getElementById('listaFallas').innerHTML = fallasF.length
    ? fallasF.map(cardFalla).join('')
    : '<div class="empty-msg">Sin fallas pendientes con estos filtros.</div>';

  const abiertas = otsF.filter(o => o.Estado === 'Abierta');
  const enCurso = otsF.filter(o => o.Estado === 'En curso');
  const cerradas = otsF.filter(o => o.Estado === 'Cerrada').slice(0, 20);

  document.getElementById('colAbiertasCount').textContent = abiertas.length;
  document.getElementById('colCursoCount').textContent = enCurso.length;
  document.getElementById('colCerradasCount').textContent = cerradas.length;

  document.getElementById('colAbiertas').innerHTML = abiertas.length ? abiertas.map(cardOTNueva).join('') : '<div class="empty-msg">Sin OTs abiertas.</div>';
  document.getElementById('colCurso').innerHTML = enCurso.length ? enCurso.map(cardOTNueva).join('') : '<div class="empty-msg">Sin OTs en curso.</div>';
  document.getElementById('colCerradas').innerHTML = cerradas.length ? cerradas.map(cardOTNueva).join('') : '<div class="empty-msg">Sin OTs cerradas recientes.</div>';
}

document.getElementById('fBusqueda').addEventListener('input', render);
document.getElementById('fPlanta').addEventListener('change', render);
document.getElementById('fPrioridad').addEventListener('change', render);
document.getElementById('btnRecargar').addEventListener('click', cargarDatos);
document.getElementById('modalDetalle').addEventListener('click', e => { if(e.target.id === 'modalDetalle') cerrarModal(); });

cargarFiltros();
cargarDatos();
setInterval(cargarDatos, 60000);
</script>
</body>
</html>
